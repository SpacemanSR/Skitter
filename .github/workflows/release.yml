# Skitter release pipeline (Windows).
#   Push to main / open a PR  → test + build, artifacts attached to the run (nothing published)
#   Push a tag like v0.3.0     → test + build + sign + publish the GitHub Release (auto-update source)
#                                + Microsoft Store package when the STORE_* variables are set
# Secrets (Settings › Secrets and variables › Actions › Secrets):
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET      app registration allowed to sign
# Variables (same page › Variables):
#   AZURE_SIGNING_ENDPOINT   e.g. https://eus.codesigning.azure.net/
#   AZURE_SIGNING_ACCOUNT    your Artifact Signing account name
#   AZURE_SIGNING_PROFILE    your certificate profile name
#   AZURE_SIGNING_PUBLISHER  the name on the certificate (your legal name for an individual account)
#   STORE_IDENTITY_NAME, STORE_PUBLISHER, STORE_PUBLISHER_DISPLAY_NAME   from Partner Center › Product identity
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; }

      - name: Fetch the pinned model
        id: model
        shell: bash
        run: |
          if [ -f model.lock.json ]; then
            node tools/fetch-model.js --require-lock
          else
            node tools/fetch-model.js
            echo "new_lock=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the new model lock (first run only; commit it)
        if: steps.model.outputs.new_lock == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: model-lock
          path: model.lock.json

      - name: Engine tests
        run: node tools/test-engine.js tests/fixtures model

      - name: Findability tests
        run: node tools/test-findability.js tests/fixtures model

      - name: Ranking quality gate
        run: node tools/eval.js --roots tests/fixtures/Documents,tests/fixtures/Desktop --cases tools/cases/fixtures.json --model model --min-top1 0.85

      - name: Build installer + portable zip (signed when Azure is configured)
        run: node tools/build-win.js --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: Smoke test the packaged app
        run: node tools/smoke.js release/win-unpacked/Skitter.exe

      - name: Check the signature
        if: env.AZURE_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "release/win-unpacked/Skitter.exe"
          Write-Host "Skitter.exe: $($sig.Status) — $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Skitter.exe is not validly signed" }
          Get-ChildItem release/*.exe | ForEach-Object { $s = Get-AuthenticodeSignature $_.FullName; Write-Host "$($_.Name): $($s.Status)"; if ($s.Status -ne 'Valid') { throw "$($_.Name) is not validly signed" } }

      - name: Build Microsoft Store package
        if: env.STORE_PUBLISHER != ''
        run: node tools/build-win.js --store

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gofer-windows
          if-no-files-found: ignore
          path: |
            release/*.exe
            release/*.zip
            release/*.appx
            release/latest.yml
            smoke-shots/
